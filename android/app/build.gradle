plugins {
    id 'com.android.application'
}

// Release signing comes from the environment, so no key is ever stored in the repository:
// SHELF_KEYSTORE=/path/release.jks SHELF_KEYSTORE_PASSWORD=... SHELF_KEY_ALIAS=shelf ./gradlew assembleRelease
def ks = System.getenv('SHELF_KEYSTORE')

android {
    namespace 'app.shelf.sync'
    compileSdk 35

    defaultConfig {
        applicationId 'app.shelf.sync'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('SHELF_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SHELF_KEY_ALIAS') ?: 'shelf'
                keyPassword System.getenv('SHELF_KEY_PASSWORD') ?: System.getenv('SHELF_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Not shrunk: the app is small, and an unshrunk build behaves exactly like the tested one.
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            // The sync engine tests talk to a real Shelf server, see SyncEngineTest.
            environment 'SHELF_TEST_URL', System.getenv('SHELF_TEST_URL') ?: ''
            environment 'LC_ALL', 'C.UTF-8'
            jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.jnu.encoding=UTF-8'
            testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full'; showStandardStreams true }
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
